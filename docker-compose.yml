name: clipvero
services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: clipvero
      POSTGRES_USER: clipvero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipvero -d clipvero"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    cpus: 1
  redis:
    image: redis:7.4-bookworm
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes: ["redis:/data"]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    cpus: 1
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment: &api_environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql+psycopg://clipvero@postgres:5432/clipvero
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    command:
      [
        "/app/.venv/bin/python",
        "-m",
        "alembic",
        "-c",
        "services/api/alembic.ini",
        "upgrade",
        "head",
      ]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment: *api_environment
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 30s
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment: *api_environment
    command:
      [
        "/app/.venv/bin/python",
        "-m",
        "celery",
        "-A",
        "clipvero_workers.app:app",
        "worker",
        "-Q",
        "maintenance",
        "--loglevel=INFO",
        "--concurrency=2",
      ]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 390s
  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment: *api_environment
    command:
      [
        "/app/.venv/bin/python",
        "-m",
        "celery",
        "-A",
        "clipvero_workers.app:app",
        "beat",
        "--schedule=/tmp/celerybeat",
        "--loglevel=INFO",
      ]
    depends_on:
      worker: { condition: service_started }
    mem_limit: 256m
    cpus: 0.5
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      CLIPVERO_BACKEND: fastapi
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_BACKEND_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    cpus: 1
    stop_grace_period: 30s
volumes:
  postgres:
  redis:
