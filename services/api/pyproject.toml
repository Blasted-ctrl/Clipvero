[project]
name = "clipvero-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.43,<2.1",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<8",
  "httpx>=0.28,<1",
  "email-validator>=2.2,<3",
  "boto3>=1.40,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
